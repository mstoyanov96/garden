<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Преглед: ориентири на картата</title>
<style>
  :root{
    --green:#2f9e52;--green-dark:#1f7a43;--green-soft:#e7f4ec;
    --muted:#7b8a7f;--card:#fff;--bg:#eef3ee;--ink:#1f2a22;
    --shadow:0 6px 18px rgba(31,42,34,.08);--radius:18px;
    --gate:#3a3f3c;--water:#2e86de;--stop:#f3b53c;--nest:#8a5a3b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px;}
  .app{max-width:460px;margin:0 auto;}
  h1{font-size:18px;margin-bottom:4px;}
  .sub{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .mapwrap{overflow:hidden;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);padding:14px 12px;}
  .grid{display:grid;gap:7px 5px;justify-content:stretch;align-items:start;width:100%;position:relative;}
  .grid .corner,.grid .colhead,.grid .rowhead{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:11px;}
  .grid .rowhead{width:16px;align-self:stretch;padding-bottom:11px;}
  .grid .colhead{height:16px;}
  .grid .house{
    background:repeating-linear-gradient(45deg,#eef6ee,#eef6ee 8px,#e4f0e4 8px,#e4f0e4 16px);
    border:2px dashed #bcd6bf;border-radius:12px;align-self:stretch;
    display:flex;align-items:center;justify-content:center;font-size:30px;padding:2px;overflow:hidden;
  }
  .grid .garden{
    background:repeating-linear-gradient(90deg,#eaf7e1,#eaf7e1 7px,#dcefce 7px,#dcefce 14px);
    border:2px dashed #b4d79a;border-radius:12px;align-self:stretch;
    display:flex;align-items:center;justify-content:center;font-size:28px;padding:2px;overflow:hidden;
  }
  .grid .coop{
    background:repeating-linear-gradient(90deg,#fff7df,#fff7df 7px,#fdeec0 7px,#fdeec0 14px);
    border:2px dashed #ecd48f;border-radius:12px;align-self:stretch;color:#9a7a1f;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;padding:2px;overflow:hidden;
  }
  .grid .dog{
    background:repeating-linear-gradient(45deg,#f3ead9,#f3ead9 8px,#e8dac0 8px,#e8dac0 16px);
    border:2px dashed #d2b48c;border-radius:12px;align-self:stretch;color:#8a6a3f;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;padding:2px;overflow:hidden;
  }
  .grid .coop>span,.grid .dog>span{font-size:9px;font-weight:700;line-height:1.1;}
  .tree-cell{width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;}
  .tree-cell .svgwrap{width:100%;max-width:40px;aspect-ratio:1;}
  .tree-cell .code{font-size:9px;font-weight:700;color:var(--muted);line-height:1;}

  /* ---- Ориентири (landmarks) ---- */
  .lm{position:relative;z-index:3;pointer-events:none;display:flex;align-items:center;justify-content:center;}
  /* порта = дървена портичка на оградата */
  /* порта = зелена кръгла иконка (вход/арка), в стила на другите маркери */
  .lm.badge.gate{background:#cfe8d6;width:23px;height:23px;}
  .lm.badge.gate svg{width:15px;height:15px;}
  .lm.gate.top{align-self:start;justify-self:start;margin-top:-14px;margin-left:-7px;}
  .lm.gate.vert{align-self:center;justify-self:end;margin-right:-14px;}
  .lm.gate.vert.edge{align-self:start;transform:translateY(-50%);}

  /* малки кръгли икони — в празнините между дърветата */
  .lm.badge{width:19px;height:19px;border-radius:50%;justify-self:center;border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.35);overflow:hidden;}
  .lm.badge svg{width:13px;height:13px;display:block;}
  .lm.cistern{background:var(--water);align-self:end;margin-bottom:3px;transform:translateX(7px);}
  .lm.stop{background:#17a08a;align-self:center;margin-top:17px;}
  .lm.nest{background:#e4d2b2;align-self:start;transform:translate(2px,calc(-50% - 2px));}

  .legend{margin-top:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;}
  .legend h2{font-size:14px;margin-bottom:8px;}
  .legend .row{display:flex;flex-wrap:wrap;gap:10px 16px;}
  .legend .it{display:flex;align-items:center;gap:7px;font-size:13px;}
  .legend .sw{width:20px;height:7px;border-radius:4px;background:var(--gate);flex:none;}
  .legend .gw{width:26px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;}
  .legend .gw svg{width:26px;height:18px;display:block;}
  .legend .bw{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .legend .bw svg{width:12px;height:12px;display:block;}
  .legend .bw.c{background:var(--water);} .legend .bw.s{background:#17a08a;} .legend .bw.n{background:#e4d2b2;} .legend .bw.g{background:#cfe8d6;}
</style>
</head>
<body>
<div class="app">
  <h1>Как бих обозначил ориентирите</h1>
  <p class="sub">Много малки тъмни чертички на оградата = порти. Малки икони = цистерна/спирка/гнездо. В празнините, без да затварят дърветата.</p>
  <div class="mapwrap"><div id="grid" class="grid"></div></div>
  <div class="legend">
    <h2>Легенда</h2>
    <div class="row" id="legendRow"></div>
  </div>
</div>

<script>
(function(){
  var ROWS = ['А','Б','В','Г','Д','Е','Ж','З','И','К','Л','М'];
  // Реална подредба: колоните са вътрешни (1..9); кодът = буква + (col-1)
  var layout = {
    'А':[2,3,4], 'Б':[2,3,4], 'В':[2,3,4],
    'Г':[1,2,3,4,5,6], 'Д':[1,2,3,4,5,6],
    'Е':[1,2,3,4,5,6,7,8,9], 'Ж':[1,2,3,4,5,6,7,8,9],
    'З':[1,2,3,4,5,6,7,8,9], 'И':[1,2,3,4,5,6,7,8,9],
    'К':[1,2,3,4,5,6,7,8,9], 'Л':[3,4,5,6,7,8,9], 'М':[7,8]
  };
  var maxCol = 9, cols2 = maxCol*2;

  // малки чисти икони (бял глиф върху цветно кръгче)
  var ICONS = {
    water: '<svg viewBox="0 0 24 24"><path d="M12 3C12 3 5 11 5 15a7 7 0 0 0 14 0C19 11 12 3 12 3Z" fill="#fff"/></svg>',
    stop:  '<svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="9" rx="2.2" fill="#fff"/><g fill="#f3b53c"><rect x="5" y="8.3" width="3" height="3" rx="0.6"/><rect x="9" y="8.3" width="3" height="3" rx="0.6"/><rect x="13" y="8.3" width="3" height="3" rx="0.6"/><rect x="17" y="8.3" width="2" height="3" rx="0.6"/></g><circle cx="7.5" cy="16.3" r="1.9" fill="#fff"/><circle cx="7.5" cy="16.3" r="0.8" fill="#f3b53c"/><circle cx="16.5" cy="16.3" r="1.9" fill="#fff"/><circle cx="16.5" cy="16.3" r="0.8" fill="#f3b53c"/></svg>',
    nest:  '<svg viewBox="0 0 24 24"><path d="M3 11c0 4 4 7 9 7s9-3 9-7Z" fill="#7a4a2f"/><ellipse cx="9.3" cy="10.6" rx="2.3" ry="1.9" fill="#fff"/><ellipse cx="14.7" cy="10.6" rx="2.3" ry="1.9" fill="#fff"/></svg>',
    gate:  '<svg viewBox="0 0 24 24"><g fill="#1f7a43"><rect x="4.4" y="5" width="2.2" height="14" rx="1"/><rect x="17.4" y="5" width="2.2" height="14" rx="1"/></g><g fill="none" stroke="#1f7a43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 12 H15"/><path d="M12.3 9.3 L15.2 12 L12.3 14.7"/></g></svg>'
  };

  function treeSVG(){
    var c = ['#4bb869','#2f9e52','#1f7a43'];
    return '<svg viewBox="0 0 64 64" width="100%" height="100%">'
      +'<rect x="29" y="42" width="6" height="16" rx="2" fill="#8a5a3b"/>'
      +'<circle cx="22" cy="30" r="14" fill="'+c[2]+'"/>'
      +'<circle cx="42" cy="30" r="14" fill="'+c[1]+'"/>'
      +'<circle cx="32" cy="20" r="15" fill="'+c[0]+'"/>'
      +'<circle cx="32" cy="30" r="13" fill="'+c[1]+'"/></svg>';
  }

  var html = '';
  html += '<div class="corner" style="grid-row:1;grid-column:1"></div>';
  for(var c=1;c<=maxCol;c++) html += '<div class="colhead" style="grid-row:1;grid-column:'+(2*c)+' / span 2">'+(c-1)+'</div>';

  // Декоративни зони (горе вдясно) — както в приложението
  var ZONES = [
    {kind:'garden', emoji:'🥬', label:'Градина', r:2, rs:3, c:10, cs:4},
    {kind:'house',  emoji:'🏠', label:'Къща',    r:2, rs:2, c:14, cs:6},
    {kind:'garden', emoji:'🥬', label:'Градина', r:4, rs:2, c:14, cs:6},
    {kind:'coop',   emoji:'🐔', label:'Кошита',  r:6, rs:1, c:14, cs:3},
    {kind:'dog',    emoji:'🐕', label:'Джари',   r:6, rs:1, c:17, cs:3}
  ];
  ZONES.forEach(function(z){
    var lbl = (z.kind==='coop'||z.kind==='dog') ? '<span>'+z.label+'</span>' : '';
    html += '<div class="'+z.kind+'" style="grid-row:'+z.r+' / span '+z.rs+';grid-column:'+z.c+' / span '+z.cs+'">'+z.emoji+lbl+'</div>';
  });

  ROWS.forEach(function(rk, ri){
    var gr = ri+2;
    html += '<div class="rowhead" style="grid-row:'+gr+';grid-column:1">'+rk+'</div>';
    (layout[rk]||[]).forEach(function(col){
      var gc = 2*col;
      html += '<div class="tree-cell" style="grid-row:'+gr+';grid-column:'+gc+' / span 2">'
        +'<div class="svgwrap">'+treeSVG()+'</div><span class="code">'+rk+(col-1)+'</span></div>';
    });
  });

  // ---- Ориентири ----
  var LM = [
    // Порта горе вляво, възможно най-близо до А1 без да я докосва
    {cls:'badge gate top',       ico:'gate', gr:2,  gc:4,  gcs:2},
    // Цистерна между А1 и А2
    {cls:'badge cistern', ico:'water', gr:2,  gc:5,  gcs:2},
    // 5 порти на дясната ограда
    {cls:'badge gate vert',      ico:'gate', gr:2,  gc:18, gcs:2},  // най-горе до къщата (ниво А)
    {cls:'badge gate vert',      ico:'gate', gr:3,  gc:18, gcs:2},  // ниво Б2
    {cls:'badge gate vert',      ico:'gate', gr:5,  gc:18, gcs:2},  // долна част на градината (ниво Г)
    {cls:'badge gate vert',      ico:'gate', gr:6,  gc:18, gcs:2},  // при Джари (ниво Д)
    {cls:'badge gate vert edge', ico:'gate', gr:11, gc:18, gcs:2},  // между И8 и К8
    // Спирка между стъблата на К5 и К6
    {cls:'badge stop',    ico:'stop', gr:11, gc:13, gcs:2},
    // Гнездо посредата между Ж6/Ж7 и З6/З7 (леко нагоре-надясно)
    {cls:'badge nest',    ico:'nest', gr:9,  gc:15, gcs:2}
  ];
  LM.forEach(function(m){
    var inner = m.ico ? ICONS[m.ico] : '';
    html += '<div class="lm '+m.cls+'" style="grid-row:'+m.gr+';grid-column:'+m.gc+' / span '+m.gcs+'">'+inner+'</div>';
  });

  document.getElementById('grid').style.gridTemplateColumns = '16px repeat('+cols2+',1fr)';
  document.getElementById('grid').innerHTML = html;

  // легенда
  document.getElementById('legendRow').innerHTML =
    '<div class="it"><span class="bw g">'+ICONS.gate+'</span>Порта</div>'
    +'<div class="it"><span class="bw c">'+ICONS.water+'</span>Цистерна</div>'
    +'<div class="it"><span class="bw s">'+ICONS.stop+'</span>Спирка</div>'
    +'<div class="it"><span class="bw n">'+ICONS.nest+'</span>Гнездо</div>';
})();
</script>
</body>
</html>
